    <!-- Applied before first paint. Reading the stored theme from React
         instead means the page paints dark, then flips — a visible flash
         for anyone whose choice is light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#f3f5fa' : '#06080f')
        } catch (e) { /* storage blocked — dark is the default */ }
      })()
    </script>
